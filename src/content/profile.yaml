# ── Research interests ────────────────────────────────────────────────────────
interests:
  - title: AI agent evaluation
    blurb: >-
      Benchmarks tell us whether an agent succeeded; they rarely tell us why, or
      whether the result will hold outside the benchmark. I am interested in
      evaluations that are faithful to real tasks, hard to game, and diagnostic,
      so that a score actually predicts behavior.
  - title: Alignment
    blurb: >-
      Alignment methods are only as good as the data and objectives behind them.
      I am interested in making preference-based alignment more robust and
      data-efficient, and in understanding when and why safety training fails
      to generalize.
  - title: Reasoning & interpretability
    blurb: >-
      When a model “reasons”, what is actually happening inside it? I am
      interested in connecting internal representations to reasoning behavior,
      and in using that understanding to make models more reliable and easier
      to evaluate.

